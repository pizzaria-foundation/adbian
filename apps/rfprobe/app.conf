# rfprobe — a tap-to-run GUI check of one thing: can this handset be a Bluetooth RFCOMM
# *server*? It opens RFCOMM, claims a channel, registers and deletes an SPP SDP record and
# listens, then shows the result of each step on screen and writes it to
# C:\Data\dump-71-btsock.txt. It is the go/no-go for the remote-shell agent.
NAME=rfprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0AA00F0

# GUI app: an icon in the menu, so there is something to tap. The probe itself is fast and
# synchronous (no inquiry, no WaitForRequest), so running it on the UI thread is safe.
USE_SHIM=1
RUST_CRATE=device

# The one gate that matters: it adds esock, bluetooth and sdpdatabase and compiles
# shim_btsock.cpp. sdpdatabase is the import nothing here has linked before — a BEGIN on
# screen (or in the .txt) means it resolved on this 2009 build.
USE_BTSOCK=1

# LocalServices is what an RFCOMM server and an SDP write are gated on. The handset is
# ROM-patched and grants all twenty, so this is minimality, not necessity.
CAPABILITIES="LocalServices ReadDeviceData WriteDeviceData"
HEAP=0x1000,0x200000
STACK=0x8000
DEBUG=1
SIGN=0
