# rshelld — the remote-shell agent as a headless daemon that comes back after a reboot.
#
# Same code as apps/rshell (the `rshell` crate without its `gui` feature), different shape and
# different reason to exist. The GUI form has to be tapped, which is fine for a session at a desk
# and useless for the work this agent is actually for: watching what the phone does *at boot*. A
# loop of "write a patch, restart, look" cannot need a finger on the screen in the middle.
#
# Headless rather than a GUI app with AUTOSTART, and that is the whole point: an Avkon app named
# in the start-up list comes up in the foreground at boot, and what this agent exists to watch is
# exactly who holds the foreground during those first seconds. An agent that changes the thing it
# is measuring is not an instrument. This one has no window group at
# all, so it is invisible both to the screen and to the shell's shutdown broadcast.
#
# It keeps its own UID3 and its own package, so installing it does not replace the tappable
# rshell. That is deliberate: if the start-up item is ignored — the platform only honours it in a
# signed package, and this handset is the judge of that — the GUI form is still there to fall back
# on. Do not run both at once: there is one SPP channel to bind and the second listener loses.

NAME=rshelld
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0AA00F2

USE_SHIM_DAEMON=1
# No menu entry, no icon, no UI resources — so no _reg.rss is required of it.
HEADLESS=1
RUST_CRATE=device

# USE_BTSOCK adds esock, bluetooth and sdpdatabase and compiles shim_btsock.cpp (the RFCOMM
# server + SDP record). The investigation verbs: exec, ps, cenrep, hal.
USE_BTSOCK=1
USE_PROC=1
USE_PROP=1
USE_CENREP=1
USE_HAL=1

# Headless: SYMBIAN_LIBS is only defaulted for the GUI build, so name them. efsrv/estor are the
# file system the shell browses, hal is what the `hal` verb reads (USE_HAL compiles the shim file
# but adds no library). esock/bluetooth/sdpdatabase and centralrepository arrive via the USE_*
# flags above. Nothing here reaches Avkon or the window server, which is what keeps a window-server
# import out of a process that runs at boot.
SYMBIAN_LIBS="euser efsrv estor hal"

# LocalServices for the RFCOMM server and the SDP write; AllFiles so the shell can read Z:\ and
# other cages; PowerMgmt for `reboot now`, which ends a process this one did not create.
CAPABILITIES="LocalServices AllFiles ReadDeviceData WriteDeviceData PowerMgmt"
HEAP=0x1000,0x400000
STACK=0x8000

# AUTOSTART needs SIGN: the S60 Startup List Management API only honours a start-up item from a
# signed (trusted) SISAPP package, and an unsigned installer usually drops it on the floor.
AUTOSTART=1
SIGN=1

# C:\Data\logs_rshelld.txt — the only window into a headless process that starts at boot, and the
# one place "did the start-up item actually fire" gets answered.
DEBUG=1
