# rshell — the remote-shell agent. A tap-to-run GUI app that turns the phone into a Bluetooth
# serial server: a paired laptop drives it to browse the filesystem, read files and write
# them. It shows connection status and recent activity on screen while it runs.
#
# GUI rather than a headless daemon so there is an icon to tap — and it is safe, because the
# RFCOMM server is fully asynchronous (accept/recv/send are active objects driven by the
# shim's event pump), so nothing here ever blocks the UI thread. A boot-persistent daemon
# form is a later hardening step.
NAME=rshell
VENDOR="Pizzaria Foundation"
VERSION=0,2,0
UID3=0xE0AA00F1

USE_SHIM=1
RUST_CRATE=device

# USE_BTSOCK adds esock, bluetooth and sdpdatabase and compiles shim_btsock.cpp (the RFCOMM
# server + SDP record). The GUI base library set (with hal/efsrv/estor) comes from USE_SHIM.

# The investigation verbs: exec (process::spawn), ps (Publish & Subscribe), cenrep and hal.
# Each is one small import the shell would otherwise need a whole new app to ask through.
USE_PROC=1
USE_PROP=1
USE_CENREP=1
USE_HAL=1

# LocalServices for the RFCOMM server and the SDP write; AllFiles so the shell can read Z:\
# and other cages and write outside its own. PowerMgmt is what `reboot now` needs: ending a
# process this one did not create. This handset grants capabilities at load whatever is
# declared here, so the declaration is documentation of intent rather than the thing that
# makes it work — which is the reason to declare it.
CAPABILITIES="LocalServices AllFiles ReadDeviceData WriteDeviceData PowerMgmt"
HEAP=0x1000,0x400000
STACK=0x8000
SIGN=0
DEBUG=1
