# What `../SDK/tools/symrelease` needs to know about this repository.

OWNER=pizzaria-foundation
REPO=ADBian

# The exception in this project: two packages, neither one inside the other. `rshelld` is the
# headless agent and `rshell` is the window that shows what it is doing — one agent, two on-phone
# shapes, and you install both.
BUILD="apps/rshelld apps/rshell"

# Both attached to ONE release. Not two releases: `/releases/latest` returns exactly one, so a
# second release would hide the first package from the phone’s catalogue entirely. This is the
# case `symbian_bootcfg::repo::Repo::filter` was written for — a plain substring per repository,
# "enough for a release that ships several of our packages at once".
SHIP="apps/rshelld/build/rshelld.sisx apps/rshell/build/rshell.sis"
